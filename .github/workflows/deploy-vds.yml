name: Deploy archive to VDS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      operation:
        description: "Deploy a new release or roll back to the previous release"
        required: true
        type: choice
        options:
          - deploy
          - rollback
        default: deploy
      archive_run_id:
        description: "Workflow run ID containing the build archive artifact (required for deploy)"
        required: false
        type: string
      archive_name:
        description: "Artifact name to download (empty = download all artifacts from run and require exactly one archive)"
        required: false
        type: string
      release_id:
        description: "Release ID for deployment (empty = short SHA + timestamp)"
        required: false
        type: string
      dry_run:
        description: "Validate inputs and remote connectivity without changing current release"
        required: false
        type: boolean
        default: false

concurrency:
  group: vds-deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    name: ${{ inputs.operation }} ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    env:
      SERVICE_NAME: ${{ vars.SERVICE_NAME || 'english-tutor-bot' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/deploy/english-tutor-bot' }}
      VDS_PORT: ${{ vars.VDS_PORT || '22' }}
      KEEP_RELEASES: ${{ vars.KEEP_RELEASES || '5' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release id
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.release_id }}" ]; then
            release_id="${{ inputs.release_id }}"
          else
            release_id="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          fi
          if ! [[ "$release_id" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "release_id must contain only letters, numbers, dots, underscores, and dashes" >&2
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Validate required secrets
        shell: bash
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VDS_HOST" || { echo "Missing environment secret VDS_HOST" >&2; exit 1; }
          test -n "$VDS_USER" || { echo "Missing environment secret VDS_USER" >&2; exit 1; }
          test -n "$VDS_SSH_KEY" || { echo "Missing environment secret VDS_SSH_KEY" >&2; exit 1; }

      - name: Validate deploy artifact input
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ inputs.archive_run_id }}" || {
            echo "archive_run_id is required for deploy. Use the run ID from the Build deployable archive workflow." >&2
            exit 1
          }

      - name: Download named build archive artifact
        if: inputs.operation == 'deploy' && inputs.archive_name != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.archive_run_id }}
          name: ${{ inputs.archive_name }}
          path: ./artifact
          github-token: ${{ github.token }}

      - name: Download all build archive artifacts
        if: inputs.operation == 'deploy' && inputs.archive_name == ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.archive_run_id }}
          path: ./artifact
          github-token: ${{ github.token }}

      - name: Select archive file
        if: inputs.operation == 'deploy'
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find ./artifact -maxdepth 2 -type f \( -name '*.tar.gz' -o -name '*.tgz' \) | sort)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one .tar.gz/.tgz archive, found ${#archives[@]}" >&2
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          fi
          echo "archive=${archives[0]}" >> "$GITHUB_OUTPUT"
          tar tzf "${archives[0]}" >/dev/null

      - name: Configure SSH
        shell: bash
        env:
          VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
          VDS_HOST: ${{ secrets.VDS_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VDS_SSH_KEY" > ~/.ssh/vds_deploy_key
          chmod 600 ~/.ssh/vds_deploy_key
          ssh-keyscan -p "${VDS_PORT}" -H "$VDS_HOST" >> ~/.ssh/known_hosts

      - name: Upload deployment script
        shell: bash
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vds_deploy_key -p "${VDS_PORT}" "${VDS_USER}@${VDS_HOST}" "mkdir -p '${DEPLOY_DIR}/ops'"
          scp -i ~/.ssh/vds_deploy_key -P "${VDS_PORT}" deploy/vds-release.sh "${VDS_USER}@${VDS_HOST}:${DEPLOY_DIR}/ops/vds-release.sh"

      - name: Upload archive
        if: inputs.operation == 'deploy'
        shell: bash
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vds_deploy_key -p "${VDS_PORT}" "${VDS_USER}@${VDS_HOST}" "mkdir -p '${DEPLOY_DIR}/incoming'"
          scp -i ~/.ssh/vds_deploy_key -P "${VDS_PORT}" "${{ steps.archive.outputs.archive }}" \
            "${VDS_USER}@${VDS_HOST}:${DEPLOY_DIR}/incoming/${{ steps.release.outputs.release_id }}.tar.gz"

      - name: Run remote deployment operation
        shell: bash
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          remote_archive="${DEPLOY_DIR}/incoming/${RELEASE_ID}.tar.gz"
          ssh -i ~/.ssh/vds_deploy_key -p "${VDS_PORT}" "${VDS_USER}@${VDS_HOST}" \
            "chmod +x '${DEPLOY_DIR}/ops/vds-release.sh' && \
             OPERATION='${OPERATION}' \
             RELEASE_ID='${RELEASE_ID}' \
             ARCHIVE_PATH='${remote_archive}' \
             DEPLOY_DIR='${DEPLOY_DIR}' \
             SERVICE_NAME='${SERVICE_NAME}' \
             KEEP_RELEASES='${KEEP_RELEASES}' \
             DRY_RUN='${DRY_RUN}' \
             '${DEPLOY_DIR}/ops/vds-release.sh'"

      - name: Show service status
        if: always() && !inputs.dry_run
        shell: bash
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vds_deploy_key -p "${VDS_PORT}" "${VDS_USER}@${VDS_HOST}" \
            "systemctl --no-pager --user status '${SERVICE_NAME}' || sudo systemctl --no-pager status '${SERVICE_NAME}' || true"
